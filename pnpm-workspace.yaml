packages:
  - packages/*
  - apps/*

# Quarantaine : une version publiée depuis moins de 3 jours n'est pas installée. La plupart des
# paquets compromis sont détectés et retirés du registre dans ce délai.
minimumReleaseAge: 4320

overrides:
  # typed-rest-client (dépendance de Stryker) épingle qs 6.15.1, touché par trois alertes de
  # sécurité (déni de service). Override vers la version corrigée, compatible (mineure) ; à retirer
  # quand typed-rest-client publiera une version à jour.
  'typed-rest-client>qs': 6.16.0
